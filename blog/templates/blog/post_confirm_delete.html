{% extends 'blog/base.html' %}
{% block content %}
<div class="row">
    <div class="col-md-6 offset-md-3">
        <div class="card p-4 shadow-sm text-center">
            <h2 class="text-danger mb-3">¿Eliminar publicación?</h2>
            <p>¿Estás seguro de que deseas eliminar permanentemente el post: <strong>"{{ object.titulo }}"</strong>?</p>
            <form method="POST">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger me-2">Sí, eliminar</button>
                <a href="{% url 'post_list' %}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
