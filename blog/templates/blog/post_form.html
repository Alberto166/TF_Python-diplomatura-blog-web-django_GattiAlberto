{% extends 'blog/base.html' %}
{% block content %}
<div class="row">
    <div class="col-md-6 offset-md-3">
        <div class="card p-4 shadow-sm">
            <h2 class="mb-4">{% if object %}Editar{% else %}Nuevo{% endif %} Post</h2>
            <form method="POST" enctype="multipart/form-data">
                {% csrf_with_token = True %}
                {% csrf_token %}
                <div class="mb-3">
                    {{ form.as_p }}
                </div>
                <button type="submit" class="btn btn-success">Guardar Publicación</button>
                <a href="{% url 'post_list' %}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
