<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Blog Django</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'post_list' %}">📝 Mi Blog</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{% url 'post_list' %}">Inicio</a>
                {% if user.is_authenticated %}
                    <a class="nav-link btn btn-sm btn-outline-primary text-white mx-2" href="{% url 'post_create' %}">+ Nuevo Post</a>
                    <span class="navbar-text text-white-50 me-2">Hola, {{ user.username }}</span>
                    <!-- El sistema de login lo crearemos en el siguiente paso -->
                {% else %}
                    <span class="navbar-text text-white-50 me-2">Visitante Anónimo</span>
                {% endif %}
            </div>
        </div>
    </nav>
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
    <script src="https://jsdelivr.net"></script>
</body>
</html>
