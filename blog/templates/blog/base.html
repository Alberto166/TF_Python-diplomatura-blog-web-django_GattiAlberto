<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Blog Django</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'post_list' %}">📝 Mi Blog</a>
                       <div class="navbar-nav ms-auto align-items-center">
                <a class="nav-link" href="{% url 'post_list' %}">Inicio</a>
                {% if user.is_authenticated %}
                    <a class="nav-link btn btn-sm btn-outline-primary text-white mx-2" href="{% url 'post_create' %}">+ Nuevo Post</a>
                    <span class="navbar-text text-white-50 me-3">Hola, <strong>{{ user.username }}</strong></span>
                    <form method="POST" action="{% url 'logout' %}" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-sm btn-danger">Cerrar Sesión</button>
                    </form>
                {% else %}
                    <a class="nav-link" href="{% url 'login' %}">Iniciar Sesión</a>
                    <a class="nav-link btn btn-sm btn-primary text-white ms-2" href="{% url 'registro' %}">Registrarse</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
    <script src="https://jsdelivr.net"></script>
</body>
</html>
